name: Release Maildesk

on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Exact main commit approved for this release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-maildesk-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      REVIEWED_SHA: ${{ inputs.reviewed_sha }}
    steps:
      - name: Require the reviewed main commit
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/main
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$REVIEWED_SHA" = "$GITHUB_SHA"

  check:
    needs: validate
    uses: ./.github/workflows/check.yml

  deploy:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.reviewed_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10.26.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Reject a superseded main commit
        shell: bash
        run: |
          read -r release_head_sha _ < <(git ls-remote --exit-code origin refs/heads/main)
          test "$release_head_sha" = "$GITHUB_SHA"
      - name: Deploy the collector, then the private dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          pnpm release:deploy
      - name: Verify live routing and scanner-safe endpoints
        run: pnpm release:verify
